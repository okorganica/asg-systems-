<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ASG Systems ERP</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;--bg:#f4f5f7;--card:#fff;--tx:#1b1d21;--mu:#6b7280;--bd:#e3e5e9;--red:#c8102e;--side:#14161a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1114;--card:#1a1d22;--tx:#eceef1;--mu:#9aa1ac;--bd:#2c3037;--side:#0a0b0d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;min-height:100vh}nav{width:220px;background:var(--side);color:#fff;padding:14px 10px;flex-shrink:0}
nav img{width:64px;height:64px;border-radius:50%;display:block;margin:0 auto 6px}nav h3{text-align:center;margin:0 0 14px;font-size:13px;letter-spacing:.5px}
nav a{display:block;padding:8px 12px;border-radius:8px;color:#cfd3d9;cursor:pointer;margin-bottom:2px}nav a.on,nav a:hover{background:var(--red);color:#fff}
main{flex:1;padding:18px;min-width:0}h2{margin:0 0 12px}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.top .sp{flex:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.k{font-size:12px;color:var(--mu)}.v{font-size:20px;font-weight:700;margin-top:2px}.red{color:var(--red)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;background:var(--card)}th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{font-size:12px;color:var(--mu);text-transform:uppercase}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}button{cursor:pointer}
.p{background:var(--red);color:#fff;border-color:var(--red)}.s{padding:3px 8px;font-size:12px;margin-right:3px}.d{color:var(--red)}
.tag{padding:2px 8px;border-radius:99px;background:var(--bd);font-size:12px}.ok{background:#16a34a;color:#fff}.bad{background:var(--red);color:#fff}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:50}
#modal>div{background:var(--card);border-radius:12px;padding:18px;width:min(720px,100%)}label{display:block;font-size:12px;color:var(--mu);margin:8px 0 2px}label+input,label+select,label+textarea{width:100%}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.lr{display:grid;grid-template-columns:2fr .7fr 1fr .6fr .6fr .8fr auto;gap:4px;margin-top:4px}.lr input,.lr select{min-width:0;width:100%}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:60}
@media(max-width:760px){#app{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;gap:4px;padding:8px}nav img,nav h3{display:none}nav a{white-space:nowrap;margin:0}.fg{grid-template-columns:1fr}.lr{grid-template-columns:1fr 1fr}}
#auth{max-width:380px;margin:12vh auto;text-align:center;padding:24px}#auth img{width:96px;border-radius:50%}
</style></head><body>

const COLS=['products','parties','purchases','sales','requests','expenses','users','accounts','resets','audit'];
const S={};COLS.forEach(c=>S[c]=[]);let db,user,uid,view='dash',q='',N={},ready=0,RF='',RT='';
const ROLES=['Super Admin','Admin','Manager','Director 1','Director 2','CEO','Sales Manager','Purchase Manager','Warehouse Manager','Finance Manager','Technician','Viewer'];
const fm=n=>'PKR '+Math.round(n||0).toLocaleString(),by=(c,id)=>S[c].find(x=>x.id===id);
const role=()=>(by('users',uid)||{}).role||'Pending';const isAdm=()=>['Super Admin','Admin'].includes(role());
const canW=()=>!['Viewer','Pending'].includes(role());
const lt=l=>(+l.qty||0)*(+l.price||0)*(1-(+l.disc||0)/100)*(1+(+l.tax||0)/100);const tot=a=>(a.lines||[]).reduce((s,l)=>s+lt(l),0);
function toast(t){const m=$('#msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',2500)}
async function save(c,id,d,act){const prev=id?by(c,id):null;id=id||c.slice(0,3)+Date.now().toString(36);
 try{await db.collection(c).doc(id).set(d);if(c!=='audit')db.collection('audit').add({u:uid,a:act||'Saved',c,id,t:Date.now(),prev:prev?JSON.stringify(prev).slice(0,300):'',next:JSON.stringify(d).slice(0,300)});return id}catch(e){toast('Save refused: '+(e.message||e.code));throw e}}
async function del(c,id){try{await db.collection(c).doc(id).delete();db.collection('audit').add({u:uid,a:'Deleted',c,id,t:Date.now()})}catch(e){toast('Delete refused')}}
function nextNo(p,c){const y=new Date().getFullYear();const m=Math.max(0,...S[c].map(x=>parseInt(String(x.no||'').split('-').pop())||0));return p+'-'+y+'-'+String(m+1).padStart(3,'0')}
function stock(pid){const p=by('products',pid)||{};let q=+p.opening||0;S.purchases.filter(x=>x.status==='Approved').forEach(x=>x.lines.forEach(l=>{if(l.pid===pid)q+=+l.qty}));
 S.sales.filter(x=>['Approved','Partially Paid','Paid'].includes(x.status)).forEach(x=>x.lines.forEach(l=>{if(l.pid===pid)q-=+l.qty}));return q}
const okS=s=>['Approved','Partially Paid','Paid'].includes(s);
function fin(f,t){const inR=d=>(!f||d>=f)&&(!t||d<=t);let rev=0,cogs=0,exp=0,cin=0,cout=0;
 S.sales.filter(x=>okS(x.status)&&inR(x.date)).forEach(x=>{rev+=tot(x);x.lines.forEach(l=>cogs+=(+l.qty||0)*(+(by('products',l.pid)||{}).cost||0));cin+=+x.paid||0});
 S.expenses.filter(x=>inR(x.date)).forEach(x=>{exp+=+x.amount;cout+=+x.amount});S.purchases.filter(x=>x.status==='Approved'&&inR(x.date)).forEach(x=>cout+=+x.paid||0);
 const ar=S.sales.filter(x=>okS(x.status)).reduce((s,x)=>s+tot(x)-(+x.paid||0),0),ap=S.purchases.filter(x=>x.status==='Approved').reduce((s,x)=>s+tot(x)-(+x.paid||0),0);
 return{rev,cogs,gp:rev-cogs,exp,np:rev-cogs-exp,cin,cout,cash:cin-cout,ar,ap}}
/* modal helpers */
function modal(h){$('#mb').innerHTML=h;$('#modal').style.display='flex'}function closeM(){$('#modal').style.display='none'}
function inp(k,l,v,t='text',o){const val=esc(v??'');if(o)return`<div><label>${l}</label><select id="f_${k}">${o.map(x=>{const[a,b]=Array.isArray(x)?x:[x,x];return`<option value="${esc(a)}"${a==v?' selected':''}>${esc(b)}</option>`}).join('')}</select></div>`;
 if(t==='area')return`<div style="grid-column:1/-1"><label>${l}</label><textarea id="f_${k}" rows="2">${val}</textarea></div>`;return`<div><label>${l}</label><input id="f_${k}" type="${t}" value="${val}"></div>`}
const g=k=>{const e=$('#f_'+k);return e?e.value:''};
function lineRow(l,pOpts){return`<div class="lr"><select class="lp">${pOpts.map(([a,b])=>`<option value="${a}"${a==l.pid?' selected':''}>${esc(b)}</option>`).join('')}</select><input class="lq" type="number" placeholder="Qty" value="${l.qty??1}"><input class="lc" type="number" placeholder="Price" value="${l.price??''}"><input class="ld" type="number" placeholder="Disc%" value="${l.disc??0}"><input class="lx" type="number" placeholder="Tax%" value="${l.tax??0}"><input class="lb" placeholder="Batch" value="${esc(l.batch||'')}"><button type="button" class="s d" onclick="this.parentNode.remove()">✕</button></div>`}
const pOpts=()=>[['','— product —'],...S.products.map(p=>[p.id,p.name+' ('+p.code+')'])];
function addLine(pr){const l={price:pr};document.getElementById('lines').insertAdjacentHTML('beforeend',lineRow(l,pOpts()))}
function readLines(){return[...document.querySelectorAll('#lines .lr')].map(r=>({pid:r.querySelector('.lp').value,qty:+r.querySelector('.lq').value,price:+r.querySelector('.lc').value,disc:+r.querySelector('.ld').value||0,tax:+r.querySelector('.lx').value||0,batch:r.querySelector('.lb').value})).filter(l=>l.pid&&l.qty>0)}
/* forms */
function fProduct(id){const p=by('products',id)||{};modal(`<h2>${id?'Edit':'Add'} Product</h2><div class="fg">${inp('name','Product Name *',p.name)}${inp('code','Product Code / SKU *',p.code)}${inp('barcode','Barcode',p.barcode)}${inp('category','Category',p.category)}${inp('brand','Brand',p.brand)}${inp('model','Model Number',p.model)}${inp('unit','Unit',p.unit||'pcs')}${inp('cost','Purchase Price',p.cost,'number')}${inp('price','Selling Price',p.price,'number')}${inp('minp','Minimum Selling Price',p.minp,'number')}${inp('reorder','Reorder Level',p.reorder??5,'number')}${inp('opening','Opening Stock',p.opening??0,'number')}${inp('warranty','Warranty',p.warranty)}${inp('status','Status',p.status||'Active','text',['Active','Inactive'])}${inp('spec','Technical Specifications',p.spec,'area')}${inp('notes','Notes (optional)',p.notes,'area')}</div>${foot(`savProduct('${id||''}')`)}`)}
const foot=f=>`<div class="top" style="margin:14px 0 0"><span class="sp"></span><button onclick="closeM()">Cancel</button><button class="p" onclick="${f}">Save</button></div>`;
async function savProduct(id){const d={};['name','code','barcode','category','brand','model','unit','warranty','status','spec','notes'].forEach(k=>d[k]=g(k).trim());['cost','price','minp','reorder','opening'].forEach(k=>d[k]=+g(k)||0);
 if(!d.name||!d.code)return toast('Name and code are required');if(S.products.some(p=>p.code===d.code&&p.id!==id))return toast('Product code already exists');await save('products',id,d);closeM();toast('Product saved')}
function fParty(id,type){const p=by('parties',id)||{type:type};modal(`<h2>${id?'Edit':'Add'} ${p.type==='Supplier'?'Supplier':'Customer'}</h2><div class="fg">${inp('type','Type',p.type,'text',['Customer','Supplier'])}${inp('name','Name *',p.name)}${inp('contact','Contact Person',p.contact)}${inp('phone','Phone',p.phone)}${inp('email','Email',p.email,'email')}${inp('ntn','NTN / Tax No.',p.ntn)}${inp('kind','Category',p.kind||'Company','text',['Individual','Company','Industry','Government','Import Supplier','Local Supplier'])}${inp('limit','Credit Limit / Terms',p.limit)}${inp('address','Address',p.address,'area')}</div>${foot(`savParty('${id||''}')`)}`)}
async function savParty(id){const d={};['type','name','contact','phone','email','ntn','kind','limit','address'].forEach(k=>d[k]=g(k).trim());if(!d.name)return toast('Name is required');await save('parties',id,d);closeM();toast('Saved')}
function fTx(c,id){const x=by(c,id)||{},P=c==='purchases',pt=S.parties.filter(p=>p.type===(P?'Supplier':'Customer'));if(x.status==='Approved'&&P||okS(x.status)&&!P&&!isAdm())return toast('Approved records are locked');
